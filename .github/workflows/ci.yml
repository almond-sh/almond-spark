name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  # Lists the cross values of each test module, so that the *-tests jobs below can
  # run one job per value rather than all of them at once via "_" / "__".
  # Values are listed in a readable form ("2.4.4-2.12.11-8" rather than the Mill
  # segment "2_4_4__2_12_11__8"), so that the matrix jobs have readable names -
  # the jobs below convert them back before passing them to Mill.
  # On pull requests, only the values whose tests are affected by the PR are listed,
  # thanks to Mill selective execution: we run 'selective.prepare' on the base
  # branch, then 'selective.resolve' on the PR (merge) commit. Mill doesn't know
  # about the CI files and the YARN Docker script, so all tests are run when those change.
  list-tests:
    runs-on: ubuntu-latest
    outputs:
      local-tests: ${{ steps.list.outputs.local-tests }}
      standalone-tests: ${{ steps.list.outputs.standalone-tests }}
      yarn-tests: ${{ steps.list.outputs.yarn-tests }}
      local-spark-distrib-tests: ${{ steps.list.outputs.local-spark-distrib-tests }}
      yarn-spark-distrib-tests: ${{ steps.list.outputs.yarn-spark-distrib-tests }}
    steps:
    - uses: actions/checkout@v7
      with:
        # for pull requests, HEAD is a merge commit whose first parent is the base branch
        fetch-depth: 2
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    - id: list
      run: |
        MODULES="local-tests standalone-tests yarn-tests local-spark-distrib-tests yarn-spark-distrib-tests"
        SELECTOR="{$(echo $MODULES | tr ' ' ',')}[_].testForked"
        HEAD_SHA="$(git rev-parse HEAD)"
        SELECTIVE=false
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          SELECTIVE=true
          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          echo "Files changed by this pull request:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(\.github/|mill-in-docker-with-yarn-cluster\.sh$)'; then
            echo "CI files changed, running all tests"
            SELECTIVE=false
          elif ! { git checkout -q HEAD^1 && ./mill selective.prepare "$SELECTOR"; }; then
            echo "Could not run selective.prepare on the base branch, running all tests"
            SELECTIVE=false
          fi
          git checkout -q "$HEAD_SHA"
        fi
        if [ "$SELECTIVE" = true ]; then
          TASKS="$(./mill selective.resolve "$SELECTOR")"
        else
          TASKS="$(./mill resolve "$SELECTOR")"
        fi
        echo "Tests to run:"
        echo "$TASKS"
        for module in $MODULES; do
          values="$(echo "$TASKS" | sed -n "s/^$module\.\(.*\)\.testForked$/\1/p" | sed "s/__/-/g; s/_/./g" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "$module: $values"
          echo "$module=$values" >> "$GITHUB_OUTPUT"
        done

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    - run: ./mill 'core[_].test'
    - run: ./mill 'almond-spark[_].test'
    - run: ./mill 'almond-toree-spark[_].test'

  local-tests:
    needs: list-tests
    if: needs.list-tests.outputs.local-tests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cross: ${{ fromJson(needs.list-tests.outputs.local-tests) }}
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    - run: |
        CROSS="$(echo '${{ matrix.cross }}' | sed 's/\./_/g; s/-/__/g')"
        ./mill "local-tests.$CROSS.testForked"

  standalone-tests:
    needs: list-tests
    if: needs.list-tests.outputs.standalone-tests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cross: ${{ fromJson(needs.list-tests.outputs.standalone-tests) }}
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    - run: |
        CROSS="$(echo '${{ matrix.cross }}' | sed 's/\./_/g; s/-/__/g')"
        ./mill "standalone-tests.$CROSS.testForked"

  yarn-tests:
    needs: list-tests
    if: needs.list-tests.outputs.yarn-tests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cross: ${{ fromJson(needs.list-tests.outputs.yarn-tests) }}
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    # the cross value is like "2.4.4-2.12.11-8" (Spark / Scala / JVM versions)
    - run: |
        CROSS="$(echo '${{ matrix.cross }}' | sed 's/\./_/g; s/-/__/g')"
        SPARK_VERSION="$(echo '${{ matrix.cross }}' | cut -d - -f 1)"
        SCALA_VERSION="$(echo '${{ matrix.cross }}' | cut -d - -f 2)"
        JVM_VERSION="$(echo '${{ matrix.cross }}' | cut -d - -f 3)"
        if [ "$JVM_VERSION" = 8 ]; then JVM_VERSION=11; fi
        HADOOP_VERSION="$(echo "$SPARK_VERSION" | awk -F . '{ print ($1 > 3 || ($1 == 3 && $2 >= 2)) ? 3 : 2 }')"
        ./mill-in-docker-with-yarn-cluster.sh \
          --hadoop-version "$HADOOP_VERSION" \
          --jvm-version "$JVM_VERSION" \
          --prefetch "$SPARK_VERSION" \
          --scala-version "$SCALA_VERSION" \
          "yarn-tests.$CROSS.testForked"

  local-distrib-tests:
    needs: list-tests
    if: needs.list-tests.outputs.local-spark-distrib-tests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cross: ${{ fromJson(needs.list-tests.outputs.local-spark-distrib-tests) }}
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    - run: |
        CROSS="$(echo '${{ matrix.cross }}' | sed 's/\./_/g; s/-/__/g')"
        ./mill "local-spark-distrib-tests.$CROSS.testForked"

  yarn-distrib-tests:
    needs: list-tests
    if: needs.list-tests.outputs.yarn-spark-distrib-tests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cross: ${{ fromJson(needs.list-tests.outputs.yarn-spark-distrib-tests) }}
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    - run: |
        CROSS="$(echo '${{ matrix.cross }}' | sed 's/\./_/g; s/-/__/g')"
        HADOOP_VERSION="$(echo '${{ matrix.cross }}' | cut -d - -f 2 | cut -d . -f 1)"
        JVM_VERSION="$(echo '${{ matrix.cross }}' | cut -d - -f 3)"
        if [ "$JVM_VERSION" = 8 ]; then JVM_VERSION=11; fi
        ./mill-in-docker-with-yarn-cluster.sh \
          --hadoop-version "$HADOOP_VERSION" \
          --jvm-version "$JVM_VERSION" \
          "yarn-spark-distrib-tests.$CROSS.testForked"

  checks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Empty sources, orphan sources, missing test classes checks
      run: ./mill -i --import io.github.alexarchambault.mill::mill-checks:0.1.2 io.github.alexarchambault.millchecks.MillChecks/allChecks
      env:
        MILL_CHECKS_ORPHAN_SOURCES_IGNORE: >-
          mill-build
    - name: Ensure computing non-final sources doesn't trigger compilation
      run: ./mill --no-daemon --import io.github.alexarchambault.mill::mill-checks:0.1.2 io.github.alexarchambault.millchecks.MillChecks/bspChecks
    # On pull requests, only check the modules affected by the PR, via Mill selective execution
    - name: Binary compatibility checks
      run: |
        HEAD_SHA="$(git rev-parse HEAD)"
        if [ "$GITHUB_EVENT_NAME" = pull_request ] && git checkout -q HEAD^1 && ./mill selective.prepare __.mimaReportBinaryIssues; then
          git checkout -q "$HEAD_SHA"
          ./mill selective.run __.mimaReportBinaryIssues
        else
          git checkout -q "$HEAD_SHA"
          ./mill __.mimaReportBinaryIssues
        fi

  format:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/setup-action@v3
    - run: cs launch scalafmt -- --check

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for the "Publish to GitHub Packages" step
      packages: write
    # Never publish to Sonatype Central from two jobs at a time (snapshots of successive pushes,
    # or a snapshot and a release). A job waits for the running one rather than cancelling it.
    # GitHub keeps only one waiting job per group though, and cancels an older waiting one.
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      PUBLISH_ARTIFACTS: __:PublishModule.publishArtifacts
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
      with:
        disableFallback: true
    - uses: coursier/setup-action@v3
      with:
        jvm: 21
    - name: Release
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          # --shouldRelease false: the bundle is uploaded and validated on Sonatype Central, but has
          # to be published manually from https://central.sonatype.com/publishing/deployments
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "almond-spark-${GITHUB_REF#refs/tags/v}" --shouldRelease false
        else
          # make sure we publish a snapshot version, even if HEAD has a 'v*' tag
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/
        fi
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    # Same artifacts, snapshots included, to https://github.com/orgs/almond-sh/packages
    # Best effort: Sonatype Central is the source of truth
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: |
        ./mill -i mill.javalib.MavenPublishModule/publishAll \
          --publishArtifacts "$PUBLISH_ARTIFACTS" \
          --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
          --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
      env:
        MILL_MAVEN_USERNAME: ${{ github.actor }}
        MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
